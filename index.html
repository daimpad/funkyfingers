<!DOCTYPE html>
<html>
<head>
<!-- Load the Paper.js library -->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Some F*s to give</title>
<meta name="description" content="Tired of everything? Generate some F*s">

<script type="text/javascript" src="paper-full.js"></script>
<script type="text/javascript" src="lodash.js"></script>

<script type="text/javascript" src="Finger.js"></script>
<script type="text/javascript" src="CanvasRecorder.js"></script>
<script type="text/javascript" src="opentype.js"></script>
<!-- Define inlined PaperScript associate it with myCanvas -->
<script type="text/javascript" src="randomTexts.js"></script>
<script type="text/javascript" src="generator.js"></script>


<link rel="stylesheet" type="text/css" href="style.css"/>


</head>
<body>


    <div id="canvwrap">
        <canvas id="myCanvas" resize></canvas>
	</div>
	<button id="menutoggle" onclick="toggleMenu()" aria-label="Menü">☰</button>
	<div id="settingswrap">

    <div class="seg">


                <input type="color" id="boxcolor" name="boxcolor"
                value="#f6b73c" onchange="changeColor(name,value)">




                <input type="color" id="fillcolor1" name="fillcolor1"
                value="#f6b73c" onchange="changeColor(name,value)">



                <input type="color" id="fillcolor2" name="fillcolor2"
                value="#f6b73c" onchange="changeColor(name,value)">



                <input type="color" id="fillcolor3" name="fillcolor3"
                value="#f6b73c" onchange="changeColor(name,value)">



                <input type="color" id="fillcolor4" name="fillcolor4"
                value="#f6b73c" onchange="changeColor(name,value)">

        </div>
        <div class="seg">
        <!-- <input type="number" id="sizex" name="sizex" value="420" onchange="changeSize(name,value)" autocomplete="off"><span>X</span><input type="number" id="sizey" name="sizey" value="420" onchange="changeSize(name,value)" autocomplete="off">
        <div class="seg"> -->
        <input type="text" oninput="changeText(value)" placeholder="FUCK IT!" id="textinput" autocomplete="off"></input>
	 </div>
        <div class="seg">
        <button id="tinyFingers"  onclick="toggleFingers()">Tiny Fingers?</button>
        <button id="shuffle"  onclick="shuffle()">Shuffle Colors</button>
        <button id="new"  onclick="generate()">New</button>
        </div>
        <div class="seg">
        <input type="file" id="svgupload" accept=".svg,image/svg+xml" multiple style="display:none" onchange="uploadSVGs(this.files)">
        <button id="uploadsvg"  onclick="document.getElementById('svgupload').click()">Upload SVG</button>
        <button id="resetshape"  onclick="resetShapes()">Reset Shape</button>
        </div>
        <div class="seg controls">
            <label>Größe<input type="range" class="slider" id="sizeslider" min="0.3" max="2.5" step="0.1" value="1" oninput="changeSVGSetting('size', this.value)"></label>
            <label>Stauchung<input type="range" class="slider" id="squashslider" min="0.3" max="2.5" step="0.1" value="1" oninput="changeSVGSetting('squash', this.value)"></label>
            <label>Anzahl<input type="range" class="slider" id="countslider" min="0.2" max="3" step="0.1" value="1" oninput="changeSVGSetting('count', this.value)"></label>
            <label>Kontur<input type="range" class="slider" id="strokeslider" min="0" max="3" step="0.1" value="1" oninput="changeSVGSetting('stroke', this.value)"></label>
            <label>Streu-Rand<input type="range" class="slider" id="marginslider" min="0" max="300" step="10" value="0" oninput="changeSVGSetting('margin', this.value)"></label>
            <label>Rotation<input type="range" class="slider" id="rotationslider" min="0" max="360" step="5" value="0" disabled oninput="changeSVGSetting('rotation', this.value)"></label>
            <label class="checklabel"><input type="checkbox" id="randomrotcheck" checked onchange="changeRandomRotation(this.checked)">Zufallsdrehung</label>
        </div>
        <div>
        <button id="savesvg"  onclick="downloadSVG()">Save SVG</button>
        <button id="savepng"  onclick="downloadPNG()">Save PNG</button>
        </div>


    </div>
    <div class="info"><a href="https://twitter.com/Bleeptrack">By @bleeptrack</a> - <a href="https://github.com/bleeptrack/funkyfingers">Code on Github</a> - <a href="https://www.patreon.com/Bleeptrack">Support me</a>
    </div>
</body>
</html>
